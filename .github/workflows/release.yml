name: Build and Release

# v* tag: tests → build, sign, notarize and publish the GitHub Release →
# update the Homebrew cask. A manual run on a branch builds and notarizes
# (artifacts on the workflow run) without publishing anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release: a notarization cut off halfway is the worst state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign, notarize and release
    needs: test
    permissions:
      contents: write
    uses: hoobnn/ci-workflows/.github/workflows/macos-release.yml@v1
    with:
      app-path: release/fanfan.app
      build-command: ./scripts/ci-build.sh && ./scripts/release-notes.sh
      artifact-basename: fanfan
      # The daemon must carry its own signature before the outer bundle is sealed.
      inner-binaries: Contents/Resources/fanfan-smcd
      entitlements: fanfan/Resources/fanfan.entitlements
      make-dmg: true
      dmg-volume-name: fanfan
      release-notes-file: release_notes.md
      # fanfan targets macOS 26.0; the default macos-15 runner cannot build it.
      runs-on: macos-26
    secrets: inherit

  homebrew:
    name: Update Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: hoobnn/ci-workflows/.github/workflows/homebrew-cask.yml@v1
    with:
      cask: fanfan
      artifact-basename: fanfan
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

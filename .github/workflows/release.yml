name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast feedback, and it needs no secrets — so it also protects fork PRs.
  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🧪 Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project fanfan.xcodeproj \
            -scheme fanfan \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

  release:
    name: Build, sign, notarize and release
    needs: test
    uses: hoobnn/ci-workflows/.github/workflows/macos-release.yml@v1
    with:
      app-path: release/fanfan.app
      build-command: ./scripts/ci-build.sh && ./scripts/release-notes.sh
      artifact-basename: fanfan
      # The daemon must carry its own signature before the outer bundle is sealed.
      inner-binaries: Contents/Resources/fanfan-smcd
      entitlements: fanfan/Resources/fanfan.entitlements
      make-dmg: true
      dmg-volume-name: fanfan
      release-notes-file: release_notes.md
      # fanfan targets macOS 26.0; the default macos-15 runner cannot build it.
      runs-on: macos-26
    secrets: inherit

  homebrew:
    name: Update Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 📥 Fetch released dmg checksum
        id: checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" \
            --pattern "fanfan-${VERSION}-macOS.dmg.sha256" \
            --dir "$RUNNER_TEMP"
          SHA=$(awk '{print $1}' "$RUNNER_TEMP/fanfan-${VERSION}-macOS.dmg.sha256")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: 🍺 Sync cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          DMG_SHA: ${{ steps.checksum.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "⚠️  HOMEBREW_TAP_TOKEN not set; skipping tap sync."
            exit 0
          fi

          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/hoobnn/homebrew-tap.git" \
            "$TAP_DIR"

          CASK="$TAP_DIR/Casks/fanfan.rb"
          # BSD sed (macOS runner) needs the -i suffix arg.
          sed -i.bak -E \
            -e "s/^(  version \")[^\"]+(\")/\1${VERSION}\2/" \
            -e "s/^(  sha256 \")[^\"]+(\")/\1${DMG_SHA}\2/" \
            "$CASK"
          rm -f "$CASK.bak"

          cd "$TAP_DIR"
          if git diff --quiet; then
            echo "ℹ️  Cask already at ${VERSION}; nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/fanfan.rb
          git commit -m "⬆️ arrow-up(fanfan): bump cask to ${VERSION}"
          git push origin HEAD
          echo "✅ Tap synced to ${VERSION}"

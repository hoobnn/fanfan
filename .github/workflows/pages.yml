name: pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp site/* _site/
          cp docs/logo.png docs/social-preview.png docs/view/zh-Hans/popover.png docs/view/zh-Hans/settings.png _site/
          version=$(gh release view --json tagName --jq '.tagName | ltrimstr("v")')
          sed -i "s/__VERSION__/${version}/g" _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

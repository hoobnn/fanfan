name: Feature request · 功能建议
description: Suggest an improvement. 提出新功能或改进建议。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? · 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution · 期望的做法
  - type: input
    id: model
    attributes:
      label: Mac model (if hardware-specific) · 机型（如与硬件相关）
